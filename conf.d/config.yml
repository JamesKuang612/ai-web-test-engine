server:
  http:
    port: 3000
  session:
    secret: '!passw0rd'
    name: SID
  cookie:
    secret: '!passw0rd'
    policy:
      httpOnly: true
      signed: true
      secure: false
storage:
  artifact_root: ./test-results
system:
  timezone: UTC
  log:
    console:
      enabled: true
      level: info
      colorize: true
    file:
      enabled: false
      level: info
      dir: ./log/
      zip: true
      rotate_days: 14
  req_log:
    enabled: true
  trace: {}
  monitor:
    port: 3100
  trusted_proxy: []
components:
  browser:
    headless: true
    viewport:
      width: 1280
      height: 720
  llm:
    provider: codex_app_server
    base_url: https://it-ai.fineres.com/v1
    api_key: ''
    model: gpt-5.6-terra
    protocol: responses
    reasoning_effort: high
    codex_command: codex
includes:
  - ./conf.d/config.includes.yml
