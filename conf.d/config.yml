server:
  http:
    port: 3000
  session:
    secret: '!passw0rd'
    name: SID
  cookie:
    secret: '!passw0rd'
    policy:
      httpOnly: true
      signed: true
      secure: false
storage:
  artifact_root: ./test-results
system:
  timezone: UTC
  log:
    console:
      enabled: true
      level: info
      colorize: true
    file:
      enabled: false
      level: info
      dir: ./log/
      zip: true
      rotate_days: 14
  req_log:
    enabled: true
  trace: {}
  monitor:
    port: 3100
  trusted_proxy: []
components:
  browser:
    headless: false
    viewport:
      width: 1280
      height: 720
  llm:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    api_key: ''
    model: deepseek-v4-flash
    protocol: chat_completions
    reasoning_effort: low
    codex_command: codex
  visual_grounding:
    enabled: true
    provider: midscene
    base_url: https://api.deepseek.com
    api_key: ''
    model: deepseek-v4-flash-vision-exp
    model_family: deepseek
    reasoning_enabled: false
    timeout_ms: 120000
includes:
  - ./conf.d/config.includes.yml
